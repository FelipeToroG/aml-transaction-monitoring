<svg viewBox="0 0 940 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AML Transaction Monitoring — Runtime Workflow</title>
  <desc id="desc">Five-stage data flow: ingestion through scoring, triage, notification and review, and continuous monitoring.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .stage-label { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 700; font-size: 12px; fill: #475569; letter-spacing: 1px; }
    .node-title { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; font-size: 13px; fill: #0f172a; }
    .node-sub { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 400; font-size: 11px; fill: #475569; }
    .header { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #0f172a; }
  </style>

  <text x="470" y="32" class="header" text-anchor="middle">AML Transaction Monitoring — Runtime Workflow</text>

  <!-- Stage 1: Ingestion -->
  <text x="60" y="80" class="stage-label">1. INGESTION</text>
  <rect x="40" y="92" width="170" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="115" class="node-title" text-anchor="middle">Transaction event</text>
  <text x="125" y="133" class="node-sub" text-anchor="middle">POST /score</text>

  <line x1="210" y1="122" x2="244" y2="122" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Scoring -->
  <text x="280" y="80" class="stage-label">2. HYBRID SCORING</text>
  <rect x="244" y="92" width="200" height="200" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="260" y="108" width="168" height="44" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="344" y="125" class="node-title" text-anchor="middle">Feature pipeline</text>
  <text x="344" y="141" class="node-sub" text-anchor="middle">entity · velocity · graph</text>

  <line x1="304" y1="156" x2="304" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="384" y1="156" x2="384" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="174" width="80" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="190" class="node-title" text-anchor="middle">Anomaly</text>
  <text x="300" y="204" class="node-sub" text-anchor="middle">IsoForest</text>

  <rect x="348" y="174" width="80" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="388" y="190" class="node-title" text-anchor="middle">Supervised</text>
  <text x="388" y="204" class="node-sub" text-anchor="middle">XGBoost</text>

  <line x1="300" y1="214" x2="334" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="388" y1="214" x2="354" y2="232" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="270" y="236" width="148" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="344" y="252" class="node-title" text-anchor="middle">Ensemble + threshold</text>
  <text x="344" y="268" class="node-sub" text-anchor="middle">tier assignment</text>

  <line x1="444" y1="258" x2="478" y2="258" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Triage -->
  <text x="540" y="80" class="stage-label">3. TRIAGE</text>
  <rect x="478" y="200" width="200" height="116" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="494" y="216" width="168" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="578" y="232" class="node-title" text-anchor="middle">Evidence bundle</text>
  <text x="578" y="246" class="node-sub" text-anchor="middle">assembled</text>

  <line x1="578" y1="260" x2="578" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="494" y="276" width="168" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="578" y="297" class="node-title" text-anchor="middle">Claude narrator</text>

  <line x1="678" y1="292" x2="712" y2="292" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: Notification + Review -->
  <text x="780" y="80" class="stage-label">4. NOTIFY &amp; REVIEW</text>
  <rect x="712" y="92" width="200" height="280" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="728" y="108" width="168" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="812" y="124" class="node-title" text-anchor="middle">Alert persisted</text>
  <text x="812" y="138" class="node-sub" text-anchor="middle">SQLite / Postgres</text>

  <line x1="812" y1="148" x2="812" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="728" y="164" width="168" height="40" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="812" y="180" class="node-title" text-anchor="middle">Webhook</text>
  <text x="812" y="194" class="node-sub" text-anchor="middle">Slack-compatible</text>

  <line x1="812" y1="204" x2="812" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="728" y="284" width="168" height="40" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="812" y="300" class="node-title" text-anchor="middle">Streamlit UI</text>
  <text x="812" y="314" class="node-sub" text-anchor="middle">investigator review</text>

  <line x1="812" y1="324" x2="812" y2="338" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="728" y="340" width="168" height="32" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="812" y="361" class="node-title" text-anchor="middle">POST /feedback</text>

  <!-- Triage path from scoring -->
  <line x1="478" y1="290" x2="450" y2="290" stroke="#475569" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="450" y1="290" x2="450" y2="280" stroke="#475569" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Stage 5: Monitoring -->
  <text x="480" y="410" class="stage-label">5. CONTINUOUS MONITORING</text>
  <rect x="40" y="422" width="872" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>

  <rect x="56" y="438" width="200" height="48" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="156" y="456" class="node-title" text-anchor="middle">Drift detector</text>
  <text x="156" y="472" class="node-sub" text-anchor="middle">PSI · features &amp; predictions</text>

  <rect x="272" y="438" width="200" height="48" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="372" y="456" class="node-title" text-anchor="middle">Fairness audit</text>
  <text x="372" y="472" class="node-sub" text-anchor="middle">per-segment FPR / TPR</text>

  <rect x="488" y="438" width="200" height="48" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="588" y="456" class="node-title" text-anchor="middle">Prometheus metrics</text>
  <text x="588" y="472" class="node-sub" text-anchor="middle">9 series · cost · latency</text>

  <rect x="704" y="438" width="192" height="48" rx="6" fill="white" stroke="#cbd5e1" stroke-width="1"/>
  <text x="800" y="456" class="node-title" text-anchor="middle">Langfuse traces</text>
  <text x="800" y="472" class="node-sub" text-anchor="middle">LLM quality &amp; cost</text>

  <line x1="812" y1="372" x2="812" y2="422" stroke="#475569" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
