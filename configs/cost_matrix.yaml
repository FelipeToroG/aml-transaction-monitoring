# =============================================================================
# Cost matrix for the cost-weighted Precision@k objective and the
# investigator-hour simulator.
# =============================================================================
# Consumed by src/evaluation/metrics.py and src/evaluation/investigator_simulator.py.
# All values are USD unless otherwise noted. Defaults are calibrated to publicly
# reported AML operations benchmarks for mid-tier payments platforms
# (Stripe Radar-class scale). Operators override these per institution by
# providing a deployment-specific overlay; the defaults below are the assumed
# baseline for the documented evaluation results.

economic_assumptions:
  # Average illicit dollars per flagged-but-missed transaction. Derived from
  # FinCEN-published SAR aggregate statistics. Significantly higher than per-
  # transaction fraud loss because laundering events tend to involve
  # coordinated multi-transaction flows.
  average_illicit_dollars_per_missed_alert: 8500.0

  # Investigator fully loaded hourly cost (salary + benefits + overhead).
  # Calibrated to a Tier-2 compliance analyst in a US-based fintech ops team.
  investigator_hourly_rate_usd: 95.0

  # Average minutes an investigator spends on an alert from queue claim to
  # disposition (cleared / escalated / SAR-filed). Includes narrative review,
  # transaction history check, and customer profile review.
  average_review_minutes_per_alert: 14.0

regulatory_cost:
  # Order-of-magnitude planning figure for the regulatory penalty exposed by a
  # single missed laundering case that later surfaces in a regulator-led
  # examination: the fine plus reputational / remediation cost. Anchored on the
  # range of OCC and FinCEN consent-order / AML penalties, NOT an audited
  # per-case number. Real enforcement actions span five to seven figures; this
  # is a deliberately conservative central estimate for planning.
  expected_penalty_per_undetected_case: 25000.0
  # Probability that a given missed alert contributes to an enforcement action.
  # A planning figure, not a measured rate. Raised from the v0 value of 0.12 to
  # 0.30 because v0 materially understated regulatory tail risk: missed SARs
  # that aggregate into a pattern are far more likely to draw an exam finding
  # than the old figure implied. See the "cost matrix understates FN regulatory
  # exposure" finding in docs/INCIDENT_REPORT.md.
  detection_probability_per_missed_case: 0.30

operational:
  # Investigator review capacity per analyst per day. Used by the
  # investigator simulator to compute realistic alert-queue depth and to
  # calibrate Precision@k where k = analyst_count * daily_capacity.
  daily_alert_capacity_per_analyst: 48
  # Number of full-time-equivalent analysts on the AML monitoring queue.
  analyst_count: 8

derived:
  # Stored explicitly rather than computed at runtime so the values appear in
  # serialized eval reports for audit traceability, and because metrics.py
  # reads false_negative_cost_usd directly from this block. The arithmetic
  # below is the authoritative reference; its inputs live in the
  # economic_assumptions and regulatory_cost sections above.
  #
  # false_negative_cost_usd is the sum of two honestly-distinct terms:
  #   sourced illicit loss (FinCEN SAR statistics):
  #     average_illicit_dollars_per_missed_alert             = 8500
  #   expected regulatory exposure (planning figures, not audited):
  #     expected_penalty_per_undetected_case
  #       * detection_probability_per_missed_case = 25000 * 0.30 = 7500
  #   total = 8500 + 7500 = 16000
  #
  # The total falls out of the inputs; it is not reverse-engineered to a round
  # number. The regulatory term exists so the optimizer stops treating a missed
  # SAR as merely the lost transaction value: the real tail risk of an
  # undetected laundering pattern is a six-to-seven-figure enforcement penalty,
  # and the FN cost must carry that weight to rank alerts sensibly.
  false_negative_cost_usd: 16000.0
  #
  # false_positive_cost_usd
  #   = investigator_hourly_rate_usd * (average_review_minutes_per_alert / 60.0)
  #   = 95 * (14 / 60) = 22.17
  false_positive_cost_usd: 22.17
