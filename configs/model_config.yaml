# =============================================================================
# Hyperparameter search spaces for the modeling stage.
# =============================================================================
# Consumed by src/models/train.py via Optuna trial.suggest_* dispatch. The
# ranges have been chosen to balance training-time cost against the empirically
# useful regions for each model family on transaction-volume tabular data with
# severe class imbalance. Senior code review should examine the *boundaries*
# rather than internal values: each bound represents a deliberate choice about
# what is reasonable for AML monitoring at payments-platform scale.

global:
  random_state: 42
  # Total budget is 200 trials, partitioned across families. The unsupervised
  # Isolation Forest gets a smaller share because its useful search region is
  # narrower than the gradient-boosted families.
  n_trials_per_family: 40
  cv_folds: 5
  # AUC-PR is used as the coarse cross-validation scoring signal during the
  # Optuna sweep because it is fast to compute and dense enough to give the
  # TPE sampler signal. Final selection across families uses cost-weighted
  # Precision@k from src/evaluation/metrics.py — see EVALUATION.md.
  scoring: average_precision

families:

  isolation_forest:
    # Unsupervised novelty detection. The capacity and tree-depth parameters
    # are tuned to balance false-positive volume against rare-pattern recall.
    n_estimators:
      type: int
      low: 100
      high: 500
      step: 50
    max_samples:
      type: float
      low: 0.3
      high: 1.0
    contamination:
      type: float
      low: 0.001
      high: 0.05
    max_features:
      type: float
      low: 0.5
      high: 1.0

  xgboost:
    # The widest search of any family because XGBoost is consistently the
    # strongest performer on this class of problem and the marginal cost of
    # additional trials is well repaid.
    n_estimators:
      type: int
      low: 200
      high: 1500
      step: 100
    max_depth:
      type: int
      low: 3
      high: 12
    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true
    subsample:
      type: float
      low: 0.6
      high: 1.0
    colsample_bytree:
      type: float
      low: 0.5
      high: 1.0
    min_child_weight:
      type: float
      low: 0.5
      high: 10.0
    reg_alpha:
      type: float
      low: 0.0001
      high: 10.0
      log: true
    reg_lambda:
      type: float
      low: 0.0001
      high: 10.0
      log: true
    # scale_pos_weight handles the class imbalance internally; the upper bound
    # of 200 corresponds to roughly the empirical neg/pos ratio in HI-Small.
    scale_pos_weight:
      type: float
      low: 1.0
      high: 200.0
      log: true

  lightgbm:
    n_estimators:
      type: int
      low: 200
      high: 1500
      step: 100
    num_leaves:
      type: int
      low: 15
      high: 255
    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true
    feature_fraction:
      type: float
      low: 0.5
      high: 1.0
    bagging_fraction:
      type: float
      low: 0.5
      high: 1.0
    bagging_freq:
      type: int
      low: 1
      high: 10
    min_child_samples:
      type: int
      low: 5
      high: 100
    reg_alpha:
      type: float
      low: 0.0001
      high: 10.0
      log: true
    reg_lambda:
      type: float
      low: 0.0001
      high: 10.0
      log: true
    is_unbalance:
      type: categorical
      choices: [true, false]

  random_forest:
    n_estimators:
      type: int
      low: 100
      high: 800
      step: 50
    max_depth:
      type: int
      low: 5
      high: 30
    min_samples_split:
      type: int
      low: 2
      high: 20
    min_samples_leaf:
      type: int
      low: 1
      high: 20
    max_features:
      type: categorical
      choices: [sqrt, log2, 0.5, 0.7]
    class_weight:
      type: categorical
      choices: [balanced, balanced_subsample]

  logistic_regression:
    # Baseline included so the README can quantify the lift of ensemble
    # methods over a linear model and demonstrate that the ensemble's
    # complexity is justified rather than assumed.
    C:
      type: float
      low: 0.001
      high: 100.0
      log: true
    penalty:
      type: categorical
      choices: [l1, l2]
    class_weight:
      type: categorical
      choices: [balanced]
    solver:
      type: categorical
      choices: [liblinear, saga]
